name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          sw_vers
          xcode-select -p
          swift --version
          xcrun --show-sdk-version

      - name: Run checks and build universal app and DMG
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          ./build-app.sh

      - name: Confirm both architectures and the SDK version
        run: |
          BIN="dist/FNB58 Monitor.app/Contents/MacOS/FNB58Monitor"
          lipo -verify_arch arm64 x86_64 "$BIN"
          for ARCH in arm64 x86_64; do
            SDK="$(vtool -arch "$ARCH" -show-build "$BIN" | awk '/sdk/ {print $2}')"
            echo "$ARCH built against SDK $SDK"
            [[ "${SDK%%.*}" -ge 26 ]]
          done

      - uses: actions/upload-artifact@v4
        with:
          name: FNB58-Monitor-dmg
          path: dist/FNB58-Monitor.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FNB58-Monitor-dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" FNB58-Monitor.dmg --title "FNB58 Monitor $TAG" --generate-notes
